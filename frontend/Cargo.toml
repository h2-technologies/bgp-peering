[package]
name = "peering-portal-frontend"
version = "0.1.0"
edition = "2021"
authors = ["ahadley1124 <admin@austinh.dev>"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = { version = "0.5", features = ["http"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "Window", "Storage"] }
urlencoding = "2.1"
