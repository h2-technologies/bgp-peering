[package]
name = "peering-portal"
version = "0.1.0"
edition = "2021"
authors = ["ahadley1124 <admin@austinh.dev>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.7" }
worker-macros = { version = "0.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
