name = "peering-portal"
main = "build/index.js"
compatibility_date = "2026-01-29"

[build]
command = "cargo install -q worker-build@^0.7.4 && worker-build --release"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1